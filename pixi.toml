[workspace]
authors = ["Cordero Core <cdcore09@gmail.com>"]
channels = ["https://prefix.dev/conda-forge", "https://prefix.dev/lsetiawan/uw-ssec"]
name = "presentations"
platforms = ["osx-arm64", "linux-64"]
version = "0.1.0"

[environments]
default = { solve-group = "default" }
# Skill-evaluation environment: Inspect and Harbor. Own solve group because
# harbor needs Python 3.12+ and the default environment carries no Python.
evals = { features = ["evals"], solve-group = "evals" }

# okf-agent-memory provides the `okf` CLI that reads and writes the project
# memory bundle at knowledge/. Run it as `pixi run okf ...`; the same binary
# backs the MCP server declared in .mcp.json.
[dependencies]
okf-agent-memory = ">=0.4.0,<0.5"

[tasks]
okf-validate = { cmd = "okf validate --strict --drift", description = "Check the knowledge/ bundle; fails on errors and producer-gate findings, not on warnings" }
verify = { depends-on = [
    "okf-validate",
    { task = "evals-check", environment = "evals" },
    { task = "inspect-smoke", environment = "evals" },
], description = "The quality gate: knowledge bundle, eval coverage and shim self-test, Inspect smoke (mock model). Must exit 0 before commit or PR" }

# Evals feature: Inspect (model-level evals) + Harbor (sandboxed agent evals)
# for evaluating the skills under .agents/skills. See evals/README.md.
[feature.evals.dependencies]
python = ">=3.12,<3.14" # harbor requires >=3.12
pytest = ">=8"
# The conda solve otherwise pins importlib-metadata 9.x, which harbor's
# litellm dependency rejects (it requires <9). Pin it here so the conda and
# PyPI halves of this environment agree.
importlib-metadata = "<9"

# Both come from PyPI on purpose. Taking inspect-ai from conda-forge pins
# websockets==17.x in the conda solve, which conflicts with harbor's
# supabase -> realtime chain (websockets<16). A single PyPI resolve settles both.
[feature.evals.pypi-dependencies]
harbor = ">=0.23.0"
inspect-ai = ">=0.3.263"
anthropic = ">=0.40"
pyyaml = ">=6"

[feature.evals.tasks]
# --- Coverage and shim self-test ------------------------------------------
evals-check = { cmd = "pytest -q tests/test_skill_evals.py", description = "Every skill has an Inspect sample file and a complete Harbor task; the fake CLIs pass their self-test; every task script parses" }
# --- Inspect ---------------------------------------------------------------
inspect-smoke = { cmd = "inspect eval evals/inspect/skill_eval.py -T smoke=true --model mockllm/model --display plain --log-dir evals/logs/inspect", description = "Every skill eval against canned answers (no API key, deterministic)" }
inspect-skill = { cmd = "inspect eval evals/inspect/skill_eval.py --display plain --log-dir evals/logs/inspect", description = "One skill against a real model, e.g. pixi run -e evals inspect-skill -T name=design-review --model anthropic/claude-haiku-4-5" }
inspect-view = { cmd = "inspect view --log-dir evals/logs/inspect", description = "Open the Inspect log viewer for local eval logs" }
# --- Harbor ----------------------------------------------------------------
# Docker build contexts can't follow symlinks out of the context directory, so
# the skills, the agent rules, and the uw-slides assets are copied into the base
# image build context before each build. Both copies are gitignored. Note the
# `src/*` form: pixi's task shell copies `src/.` as a nested directory.
harbor-sync = { cmd = "rm -rf evals/harbor/base/skills evals/harbor/base/repo && mkdir -p evals/harbor/base/skills evals/harbor/base/repo/.agents && cp -R .agents/skills/* evals/harbor/base/skills/ && cp -R evals/skills/* evals/harbor/base/skills/ && cp -R .agents/rules evals/harbor/base/repo/.agents/ && cp -R .agents/uw-slides evals/harbor/base/repo/.agents/ && cp AGENTS.md CLAUDE.md evals/harbor/base/repo/", description = "Copy every skill, the agent rules, and the uw-slides assets into the harbor base image build context (gitignored)" }
harbor-base = { cmd = "docker build -t presentations-skill-evals-base:local evals/harbor/base", depends-on = ["harbor-sync"], description = "Build the shared harbor base image: git, fake pixi/okf, all skills, the repo's rules and slide assets" }
harbor-oracle = { cmd = "harbor run -p evals/harbor/tasks -a oracle -o evals/logs/harbor --force-build -q", depends-on = ["harbor-base"], description = "Run every harbor task with the oracle agent (needs Docker)" }
harbor-agent = { cmd = "harbor run -p evals/harbor/tasks -a claude-code -o evals/logs/harbor --force-build", depends-on = ["harbor-base"], description = "Run every harbor task with a real agent, e.g. pixi run -e evals harbor-agent -m anthropic/claude-haiku-4-5" }
harbor-dry-run = { cmd = "bash evals/harbor/dry-run.sh", description = "Docker-free check: every task's fixture, oracle solution and verifier, with container paths rewritten to a temp root; oracle must score 1, nop 0" }
harbor-view = { cmd = "harbor view evals/logs/harbor", description = "Open the Harbor trajectory viewer for local job logs" }
# --- Combined --------------------------------------------------------------
evals-smoke = { depends-on = ["evals-check", "inspect-smoke", "harbor-oracle"], description = "Coverage test, Inspect smoke, then every harbor task with the oracle agent (needs Docker)" }

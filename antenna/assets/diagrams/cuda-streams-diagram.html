<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>CUDA streams before and after</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: transparent; height: 100%; overflow: hidden;
    font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; }
  body { display: flex; align-items: stretch; }
  svg { width: 100%; height: 100%; display: block; }
  text { font-size: 13px; }
  .lane { font-size: 13px; }
  .sub  { font-size: 11px; }
</style>
</head>
<body>
<svg viewBox="0 0 820 288" preserveAspectRatio="xMidYMid meet"
     role="img" xmlns="http://www.w3.org/2000/svg">
  <title>CUDA streams: before and after</title>
  <desc>Before shows serial transfer then compute on a single stream, with GPU idle during every transfer. After shows two streams: the prefetch stream transfers batch N+1 while stream 0 computes batch N, so the GPU runs continuously.</desc>

  <!-- ════════════════════════════════════════
       BEFORE — single stream, serial
       ════════════════════════════════════════ -->
  <text x="140" y="15" font-size="12" font-weight="600" fill="#555">Before: single stream, serial</text>

  <!-- lane labels -->
  <text class="lane" x="8"  y="44"  fill="#666">Stream 0</text>
  <text class="lane" x="8"  y="84"  fill="#666">GPU</text>

  <!-- Stream 0: alternating to(cuda) / forward, slot w=90 starting x=140 -->
  <rect x="140" y="30" width="90" height="22" rx="3" fill="#F4D6A0"/>
  <text x="185" y="45" text-anchor="middle" fill="#6A4300">to(cuda) B1</text>

  <rect x="230" y="30" width="90" height="22" rx="3" fill="#9FE1CB"/>
  <text x="275" y="45" text-anchor="middle" fill="#085041">forward B1</text>

  <rect x="320" y="30" width="90" height="22" rx="3" fill="#F4D6A0"/>
  <text x="365" y="45" text-anchor="middle" fill="#6A4300">to(cuda) B2</text>

  <rect x="410" y="30" width="90" height="22" rx="3" fill="#9FE1CB"/>
  <text x="455" y="45" text-anchor="middle" fill="#085041">forward B2</text>

  <rect x="500" y="30" width="90" height="22" rx="3" fill="#F4D6A0"/>
  <text x="545" y="45" text-anchor="middle" fill="#6A4300">to(cuda) B3</text>

  <rect x="590" y="30" width="90" height="22" rx="3" fill="#9FE1CB"/>
  <text x="635" y="45" text-anchor="middle" fill="#085041">forward B3</text>

  <text x="694" y="45" fill="#999" font-size="16">…</text>

  <!-- GPU: idle during transfers, busy during computes -->
  <rect x="140" y="70" width="90" height="22" rx="3" fill="#EBEBEB" stroke="#CFCFCF" stroke-width="0.5"/>
  <text x="185" y="85" text-anchor="middle" fill="#AAAAAA">idle</text>

  <rect x="230" y="70" width="90" height="22" rx="3" fill="#5DCAA5"/>
  <text x="275" y="85" text-anchor="middle" fill="#085041">B1</text>

  <rect x="320" y="70" width="90" height="22" rx="3" fill="#EBEBEB" stroke="#CFCFCF" stroke-width="0.5"/>
  <text x="365" y="85" text-anchor="middle" fill="#AAAAAA">idle</text>

  <rect x="410" y="70" width="90" height="22" rx="3" fill="#5DCAA5"/>
  <text x="455" y="85" text-anchor="middle" fill="#085041">B2</text>

  <rect x="500" y="70" width="90" height="22" rx="3" fill="#EBEBEB" stroke="#CFCFCF" stroke-width="0.5"/>
  <text x="545" y="85" text-anchor="middle" fill="#AAAAAA">idle</text>

  <rect x="590" y="70" width="90" height="22" rx="3" fill="#5DCAA5"/>
  <text x="635" y="85" text-anchor="middle" fill="#085041">B3</text>

  <!-- idle annotations -->
  <text class="sub" x="185" y="107" text-anchor="middle" fill="#C0392B">GPU waits</text>
  <text class="sub" x="365" y="107" text-anchor="middle" fill="#C0392B">GPU waits</text>
  <text class="sub" x="545" y="107" text-anchor="middle" fill="#C0392B">GPU waits</text>

  <!-- time axis -->
  <line x1="140" y1="117" x2="690" y2="117" stroke="#999" stroke-width="1"/>
  <text x="695" y="121" fill="#999">time →</text>

  <!-- section divider -->
  <line x1="8" y1="132" x2="812" y2="132" stroke="#E0E0E0" stroke-width="0.8"/>

  <!-- ════════════════════════════════════════
       AFTER — two streams, overlapped
       ════════════════════════════════════════ -->
  <text x="140" y="148" font-size="12" font-weight="600" fill="#555">After: prefetch stream — to(device, non_blocking=True)</text>

  <!-- lane labels -->
  <text class="lane" x="8" y="174" fill="#666">Stream 1</text>
  <text class="sub"  x="8" y="187" fill="#999">(prefetch)</text>
  <text class="lane" x="8" y="214" fill="#666">Stream 0</text>
  <text class="sub"  x="8" y="227" fill="#999">(compute)</text>
  <text class="lane" x="8" y="254" fill="#666">GPU</text>

  <!-- Stream 1 (prefetch): continuous transfers -->
  <rect x="140" y="160" width="90" height="22" rx="3" fill="#F4D6A0"/>
  <text x="185" y="175" text-anchor="middle" fill="#6A4300">to(cuda) B1</text>

  <rect x="230" y="160" width="90" height="22" rx="3" fill="#F4D6A0"/>
  <text x="275" y="175" text-anchor="middle" fill="#6A4300">to(cuda) B2</text>

  <rect x="320" y="160" width="90" height="22" rx="3" fill="#F4D6A0"/>
  <text x="365" y="175" text-anchor="middle" fill="#6A4300">to(cuda) B3</text>

  <rect x="410" y="160" width="90" height="22" rx="3" fill="#F4D6A0"/>
  <text x="455" y="175" text-anchor="middle" fill="#6A4300">to(cuda) B4</text>

  <text x="514" y="175" fill="#999" font-size="16">…</text>

  <!-- Stream 0 (compute): one slot of warmup, then continuous -->
  <!-- slot 1 (x=140): empty warmup -->
  <rect x="230" y="200" width="90" height="22" rx="3" fill="#9FE1CB"/>
  <text x="275" y="215" text-anchor="middle" fill="#085041">forward B1</text>

  <rect x="320" y="200" width="90" height="22" rx="3" fill="#9FE1CB"/>
  <text x="365" y="215" text-anchor="middle" fill="#085041">forward B2</text>

  <rect x="410" y="200" width="90" height="22" rx="3" fill="#9FE1CB"/>
  <text x="455" y="215" text-anchor="middle" fill="#085041">forward B3</text>

  <text x="514" y="215" fill="#999" font-size="16">…</text>

  <!-- GPU: one slot warmup, then continuous -->
  <rect x="230" y="240" width="90" height="22" rx="3" fill="#5DCAA5"/>
  <text x="275" y="255" text-anchor="middle" fill="#085041">B1</text>

  <rect x="320" y="240" width="90" height="22" rx="3" fill="#5DCAA5"/>
  <text x="365" y="255" text-anchor="middle" fill="#085041">B2</text>

  <rect x="410" y="240" width="90" height="22" rx="3" fill="#5DCAA5"/>
  <text x="455" y="255" text-anchor="middle" fill="#085041">B3</text>

  <text x="514" y="255" fill="#999" font-size="16">…</text>

  <!-- "GPU busy" bracket -->
  <line x1="230" y1="270" x2="500" y2="270" stroke="#1D9E75" stroke-width="1"/>
  <line x1="230" y1="267" x2="230" y2="273" stroke="#1D9E75" stroke-width="1"/>
  <line x1="500" y1="267" x2="500" y2="273" stroke="#1D9E75" stroke-width="1"/>
  <text x="365" y="284" text-anchor="middle" fill="#0F6E56" font-size="11">GPU busy: to(cuda) B2 overlaps forward B1</text>

  <!-- time axis -->
  <line x1="140" y1="288" x2="690" y2="288" stroke="#999" stroke-width="1"/>

  <!-- warmup bracket in AFTER -->
  <line x1="140" y1="160" x2="140" y2="262" stroke="#CFCFCF" stroke-width="0.8" stroke-dasharray="3 2"/>
  <line x1="230" y1="160" x2="230" y2="262" stroke="#CFCFCF" stroke-width="0.8" stroke-dasharray="3 2"/>
  <text x="185" y="245" text-anchor="middle" fill="#BBBBBB" font-size="10">warmup</text>
</svg>
</body>
</html>

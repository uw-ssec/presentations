<link rel="stylesheet" href="../shared/slide-base.css">
<section data-slide="02-join-mentimeter" aria-label="Join the Mentimeter poll" class="slide dark" data-presenter="both">
  <div class="accent-bar-top"></div>
  <div class="content">
    <div class="text">
      <p class="eyebrow">Before we start</p>
      <h1>Scan to join</h1>
      <p class="lead">Join the polls from your phone.</p>
      <ul class="how">
        <li>We'll show you what worked, what failed, and what we changed.</li>
        <li>To follow along, fork the demo repo and open a Codespace. Ask your agent to copy the demo issues.</li>
        <li>You're also welcome to just watch and ask questions.</li>
      </ul>
    </div>
    <figure class="qr"><img src="../assets/images/menti-qr.png" alt="QR code that opens the Mentimeter poll for this session"></figure>
  </div>
  <style>
    section[data-slide="02-join-mentimeter"] { background: var(--surface-terminal); align-items: center; padding: var(--space-20); }
    section[data-slide="02-join-mentimeter"] .content { display: grid; grid-template-columns: 1.2fr 1fr; gap: var(--space-16); align-items: center; width: 100%; }
    section[data-slide="02-join-mentimeter"] h1 { font-family: var(--font-display); font-size: var(--slide-hero); font-weight: var(--font-extrabold); letter-spacing: var(--tracking-tight); line-height: var(--leading-tight); color: var(--text-primary); margin: var(--space-2) 0 var(--space-4); }
    section[data-slide="02-join-mentimeter"] .lead { font-size: var(--slide-lead); color: var(--text-secondary); margin-bottom: var(--space-8); }
    section[data-slide="02-join-mentimeter"] .how { list-style: none; }
    section[data-slide="02-join-mentimeter"] .how li { position: relative; padding-left: var(--space-8); margin-bottom: var(--space-4); font-size: var(--slide-body); line-height: var(--leading-relaxed); color: var(--text-secondary); }
    section[data-slide="02-join-mentimeter"] .how li::before { content: ""; position: absolute; left: 0; top: 0.68em; width: 10px; height: 7px; background: var(--color-teal-500); transform: skewX(calc(-1 * var(--angle-brand))); }
    section[data-slide="02-join-mentimeter"] .qr { margin: 0; background: var(--color-white); padding: var(--space-6); border-radius: var(--radius-lg); box-shadow: var(--shadow-glow-teal-md); }
    section[data-slide="02-join-mentimeter"] .qr img { width: 100%; display: block; }
  </style>
</section>

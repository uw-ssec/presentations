<link rel="stylesheet" href="../shared/slide-base.css">
<section data-slide="12-menti-grade-before" aria-label="Mentimeter: grade the baseline answer" class="slide dark" data-presenter="cordero">
  <div class="accent-bar-top"></div>
  <div class="content">
    <p class="eyebrow">Mentimeter</p>
    <h1>You are that grad student. How helpful was that answer?</h1>
    <p class="note">Rate it from 1 to 5: could you start the issue with this answer? Remember your score. We'll ask again later.</p>
  </div>
  <style>
    section[data-slide="12-menti-grade-before"] { background: var(--surface-terminal); align-items: center; padding: var(--space-20); }
    section[data-slide="12-menti-grade-before"] .content { width: 100%; max-width: 1400px; }
    section[data-slide="12-menti-grade-before"] h1 { font-family: var(--font-display); font-size: var(--slide-hero); font-weight: var(--font-extrabold); letter-spacing: var(--tracking-tight); line-height: var(--leading-tight); color: var(--text-primary); margin: var(--space-4) 0 var(--space-8); }
    section[data-slide="12-menti-grade-before"] .note { font-size: var(--slide-lead); color: var(--text-secondary); line-height: var(--leading-relaxed); max-width: 1100px; }
  </style>
</section>

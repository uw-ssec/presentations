
  <!-- Deck progress: replaces the static teal accent bar on screen -->
  <div class="deck-progress" aria-hidden="true"><div id="deck-progress-fill" class="deck-progress-fill"></div></div>

  <!-- Slide counter -->
  <div class="slide-counter" aria-live="polite" aria-atomic="true">
    <span id="current-slide">1</span> / <span id="total-slides">0</span>
  </div>

  <!-- Presenter badge and running timer (deck-specific) -->
  <div class="deck-hud" aria-live="polite">
    <span id="presenter-badge" class="presenter-badge" hidden></span>
    <span id="deck-timer" class="deck-timer" title="t: pause/resume · r: reset">00:00</span>
  </div>

  <style>
    .deck-progress {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 4px;
      background: rgba(46, 210, 192, 0.25);
      z-index: 1000;
      pointer-events: none;
    }
    .deck-progress-fill {
      height: 100%;
      width: 0;
      background: var(--color-teal-500);
      transition: width 0.3s ease;
    }
    @media screen { .slide > .accent-bar-top { display: none; } }
    @media print  { .deck-progress { display: none !important; } }

    .fullscreen-toggle {
      position: absolute;
      top: 20px; right: 20px;
      width: 40px; height: 40px;
      padding: 8px;
      border: 0;
      border-radius: 4px;
      background: transparent;
      color: var(--color-white);
      opacity: 0.35;
      cursor: pointer;
      z-index: var(--z-dropdown);
      transition: opacity 0.2s ease;
    }
    .fullscreen-toggle:hover, .fullscreen-toggle:focus-visible { opacity: 0.9; outline: 2px solid var(--color-teal-500); outline-offset: 2px; }
    .fullscreen-toggle svg { width: 100%; height: 100%; display: block; }

    .slide-counter {
      position: fixed;
      bottom: 24px;
      right: 24px;
      font-family: var(--font-body);
      font-size: 18px;
      color: #fff;
      background: rgba(0, 0, 0, 0.5);
      padding: 8px 16px;
      border-radius: 4px;
      z-index: 1000;
      pointer-events: none;
    }

    .deck-hud {
      position: fixed;
      bottom: 24px;
      left: 24px;
      display: flex;
      align-items: center;
      gap: 12px;
      z-index: 1000;
      pointer-events: none;
    }

    .presenter-badge {
      font-family: var(--font-compressed);
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 8px 14px;
      border-radius: 4px;
      color: var(--color-purple-950);
      background: var(--color-teal-500);
    }
    .presenter-badge[data-presenter="don"]     { background: var(--color-teal-500); color: var(--color-purple-950); }
    .presenter-badge[data-presenter="cordero"] { background: var(--color-gold-500); color: var(--color-purple-950); }
    .presenter-badge[data-presenter="both"]    { background: var(--color-purple-200); color: var(--color-purple-950); }

    .deck-timer {
      font-family: var(--font-mono);
      font-size: 18px;
      font-variant-numeric: tabular-nums;
      color: #fff;
      background: rgba(0, 0, 0, 0.5);
      padding: 8px 14px;
      border-radius: 4px;
    }
    .deck-timer.is-paused { opacity: 0.6; }
    .deck-timer.is-warn   { color: var(--color-gold-500); }
    .deck-timer.is-over   { color: var(--color-pink-400); }
  </style>

  <script>
    // Slide navigation system
    let currentSlide = 0;
    const slides = document.querySelectorAll('.slide');
    const totalSlides = slides.length;

    // Presenter badge
    const badge = document.getElementById('presenter-badge');
    const presenterNames = { don: 'Don', cordero: 'Cordero', both: 'Don + Cordero' };
    function updateBadge() {
      const who = slides[currentSlide].dataset.presenter;
      if (who && presenterNames[who]) {
        badge.textContent = presenterNames[who];
        badge.dataset.presenter = who;
        badge.hidden = false;
      } else {
        badge.hidden = true;
      }
    }

    // Running timer: starts the first time the deck leaves slide 1
    const timerEl = document.getElementById('deck-timer');
    let timerStart = null, timerPausedAt = null, timerOffset = 0;
    const WARN_MIN = 50, OVER_MIN = 60;
    function elapsedMs() {
      if (timerStart === null) return 0;
      const now = timerPausedAt !== null ? timerPausedAt : Date.now();
      return now - timerStart + timerOffset;
    }
    function renderTimer() {
      const s = Math.floor(elapsedMs() / 1000);
      const mm = String(Math.floor(s / 60)).padStart(2, '0');
      const ss = String(s % 60).padStart(2, '0');
      timerEl.textContent = mm + ':' + ss;
      timerEl.classList.toggle('is-warn', s >= WARN_MIN * 60 && s < OVER_MIN * 60);
      timerEl.classList.toggle('is-over', s >= OVER_MIN * 60);
      timerEl.classList.toggle('is-paused', timerPausedAt !== null);
    }
    function startTimer() {
      if (timerStart === null) { timerStart = Date.now(); timerOffset = 0; timerPausedAt = null; }
    }
    function toggleTimer() {
      if (timerStart === null) { startTimer(); return; }
      if (timerPausedAt === null) { timerPausedAt = Date.now(); }
      else { timerOffset += 0; timerStart += Date.now() - timerPausedAt; timerPausedAt = null; }
    }
    function resetTimer() { timerStart = null; timerPausedAt = null; timerOffset = 0; renderTimer(); }
    setInterval(renderTimer, 500);

    function showSlide(n) {
      // Remove active class from all slides
      slides.forEach(slide => slide.classList.remove('active'));

      // Clamp to valid range
      currentSlide = Math.max(0, Math.min(n, totalSlides - 1));

      // Show current slide
      slides[currentSlide].classList.add('active');

      // Update counter and progress bar
      document.getElementById('current-slide').textContent = currentSlide + 1;
      document.getElementById('deck-progress-fill').style.width = ((currentSlide + 1) / totalSlides * 100) + '%';

      // Update URL hash
      window.location.hash = currentSlide + 1;

      updateBadge();
      if (currentSlide > 0) startTimer();
    }

    // Keyboard navigation
    document.addEventListener('keydown', (e) => {
      if (e.target.closest('button, input, select, textarea, [contenteditable]')) return;
      if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') {
        e.preventDefault();
        showSlide(currentSlide + 1);
      } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
        e.preventDefault();
        showSlide(currentSlide - 1);
      } else if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
        const walk = walkthroughs.get(slides[currentSlide]);
        if (!walk) return;
        e.preventDefault();
        if (e.key === 'ArrowDown') walk.forward(); else walk.back();
      } else if (e.key === 'Home') {
        e.preventDefault();
        showSlide(0);
      } else if (e.key === 'End') {
        e.preventDefault();
        showSlide(totalSlides - 1);
      } else if (e.key === 't' || e.key === 'T') {
        toggleTimer(); renderTimer();
      } else if (e.key === 'r' || e.key === 'R') {
        resetTimer();
      }
    });

    // Click to advance (anywhere except the HUD)
    document.addEventListener('click', (e) => {
      if (!e.target.closest('.slide-counter') && !e.target.closest('.deck-hud') && !e.target.closest('a, button, input, select, textarea, [data-interactive]')) {
        showSlide(currentSlide + 1);
      }
    });

    // Presenter-controlled walkthroughs. All stages stay visible in the overview.
    // Buttons and the Up/Down arrow keys drive the same controller.
    const walkthroughs = new Map();
    document.querySelectorAll('[data-walkthrough]').forEach(group => {
      const section = group.closest('section');
      const stages = Array.from(group.querySelectorAll('[data-stage]'));
      const next = section.querySelector('[data-next]');
      const overview = section.querySelector('[data-overview]');
      const status = section.querySelector('.status');
      let step = -1;
      const setStep = (n) => {
        step = n;
        stages.forEach((stage, i) => {
          stage.classList.toggle('is-current', i === step);
          if (i === step) stage.setAttribute('aria-current', 'step');
          else stage.removeAttribute('aria-current');
        });
        if (step === -1) {
          next.textContent = 'Walk through';
          status.textContent = 'Overview';
        } else {
          status.textContent = `Step ${step + 1} of ${stages.length}`;
          next.textContent = step === stages.length - 1 ? 'Show overview' : 'Next step';
        }
      };
      const reset = () => setStep(-1);
      const forward = () => setStep(step === stages.length - 1 ? -1 : step + 1);
      const back = () => { if (step > -1) setStep(step - 1); };
      next.addEventListener('click', forward);
      overview.addEventListener('click', reset);
      walkthroughs.set(section, { forward, back, reset });
    });

    // Initialize presentation
    document.addEventListener('DOMContentLoaded', () => {
      // Set total slides
      document.getElementById('total-slides').textContent = totalSlides;

      // Load from hash if present
      if (window.location.hash) {
        const hashSlide = parseInt(window.location.hash.slice(1)) - 1;
        if (!isNaN(hashSlide) && hashSlide >= 0 && hashSlide < totalSlides) {
          showSlide(hashSlide);
          return;
        }
      }

      // Otherwise show first slide
      showSlide(0);
    });

    // Handle browser back/forward buttons
    window.addEventListener('hashchange', () => {
      const hashSlide = parseInt(window.location.hash.slice(1)) - 1;
      if (!isNaN(hashSlide) && hashSlide >= 0 && hashSlide < totalSlides) {
        // Update without creating new history entry
        slides.forEach(slide => slide.classList.remove('active'));
        currentSlide = hashSlide;
        slides[currentSlide].classList.add('active');
        document.getElementById('current-slide').textContent = currentSlide + 1;
        document.getElementById('deck-progress-fill').style.width = ((currentSlide + 1) / totalSlides * 100) + '%';
        updateBadge();
      }
    });

    // Full-screen toggle (title slide icon)
    document.querySelectorAll('[data-fullscreen]').forEach(btn => {
      btn.addEventListener('click', () => {
        if (document.fullscreenElement) document.exitFullscreen();
        else document.documentElement.requestFullscreen();
      });
    });
    document.addEventListener('fullscreenchange', () => {
      const on = !!document.fullscreenElement;
      document.querySelectorAll('[data-fullscreen]').forEach(btn => {
        btn.setAttribute('aria-label', on ? 'Exit full screen' : 'Enter full screen');
        btn.title = on ? 'Exit full screen' : 'Full screen';
      });
    });
  </script>
</body>
</html>
